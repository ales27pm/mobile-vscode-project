name: Finalize P0 dependency lock

on:
  pull_request:
    branches: [main]
    paths:
      - apps/mobile/package.json
      - .github/workflows/agent-p0-finalize.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-bootstrap-connectivity
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Regenerate Yarn lockfile
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --ignore-engines --ignore-scripts
          grep -q '^expo-secure-store@~15.0.8:' yarn.lock

      - name: Commit lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/agent-p0-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yarn.lock .github/workflows/agent-p0-finalize.yml
          git commit -m 'Regenerate lockfile for secure storage'
          git push origin HEAD:agent/p0-bootstrap-connectivity
